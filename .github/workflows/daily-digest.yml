name: 每日早报定时任务

on:
  schedule:
    # 每天北京时间早上 08:00 (UTC 00:00) 自动触发
    - cron: '0 0 * * *'
  workflow_dispatch: # 支持在 GitHub 网页上手动点击测试触发

jobs:
  trigger-digest:
    runs-on: ubuntu-latest
    steps:
      - name: 唤起家庭事务微信早报推送
        run: |
          echo "正在触发每日两周微信早报推送..."
          curl -s -X GET "https://family-affairs-one.vercel.app/api/cron-digest"
